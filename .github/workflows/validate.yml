name: Validate

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a breaking change in Home Assistant or HACS shows up before
    # a user hits it.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Deny by default, as in the HACS example; the hassfest job opts back into the
# read access its checkout needs.
permissions: {}

jobs:
  validate-hacs:
    name: HACS
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Documented ignorable check. The brands check requires the domain to
          # exist in home-assistant/brands, which is only mandatory to submit to
          # the default HACS store. Drop this once hp_cdm is merged there.
          ignore: "brands"

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
